<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f5132" />
  <title>Çıkış - Dini Kutuphane</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --green: #0f5132;
      --green-dark: #0a3d26;
      --green-light: #d8efe3;
      --gold: #c9a227;
      --bg: #f4f6f4;
      --text: #1c2b24;
      --muted: #6b7c72;
      --border: #dbe3dd;
      --radius: 14px;
      --shadow: 0 2px 10px rgba(15, 81, 50, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--card, #fff);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      text-align: center;
      max-width: 380px;
      width: 90%;
    }
    .icon { font-size: 56px; display: block; margin-bottom: 14px; }
    h1 { font-size: 22px; color: var(--green); margin-bottom: 10px; }
    p { color: var(--muted); font-size: 15px; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 15px;
      border: none;
      cursor: pointer;
    }
    .btn:hover { background: var(--green-dark); }
    .small { font-size: 12px; color: #a3b3aa; margin-top: 18px; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">📖</span>
    <h1>Dini Kutuphane kapatıldı</h1>
    <p>Uygulamadan çıktınız. Bu sekmeyi güvenle kapatabilirsiniz.</p>
    <a class="btn" href="./">Geri Dön</a>
    <p class="small">Yeni Oturum · Ana Kitaplik</p>
  </div>
</body>
</html>
